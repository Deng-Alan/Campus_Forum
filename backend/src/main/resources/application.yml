server:
  port: 8080
  # servlet:
  #   context-path: /api  # 已注释，直接在Controller中使用完整路径

spring:
  application:
    name: campus-forum

  # 数据源配置 - PostgreSQL
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/campus_forum?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: postgres
    password: 918112
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: CampusForumHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 200
        max-wait: -1ms
        max-idle: 10
        min-idle: 0

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # Servlet 配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.campus.forum.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: 
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: your-256-bit-secret-key-for-campus-forum-application-2024
  expiration: 86400000   # 24小时 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)
  header: Authorization
  prefix: "Bearer "

# 日志配置
logging:
  level:
    root: info
    com.campus.forum: debug
    com.baomidou.mybatisplus: debug
  file:
    name: logs/campus-forum.log
    max-size: 10MB
    max-history: 30

# Knife4j 文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类

# 自定义配置
campus:
  # 文件上传配置
  upload:
    path: uploads/
    allowed-types: jpg,jpeg,png,gif,webp
    max-size: 5242880  # 5MB
  
  # 验证码配置
  captcha:
    enabled: false  # 测试时临时关闭
    expire: 300  # 5分钟

  # 内容审核配置
  content:
    sensitive-words-enabled: true
    auto-audit-enabled: true

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_forum_dev

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_forum
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
logging:
  level:
    root: warn
    com.campus.forum: info
